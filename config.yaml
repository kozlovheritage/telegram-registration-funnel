texts:
  welcome: "Привет! Это короткая регистрация. Нажми кнопку ниже, чтобы поделиться телефоном."
  welcome_registered: "С возвращением! Регистрация уже завершена."
  request_phone: "Поделись номером телефона кнопкой «Отправить номер»."
  invalid_contact: "Пожалуйста, отправь свой контакт кнопкой «Отправить номер»."
  phone_received: "Спасибо, регистрация завершена. Дашборд показывает статистику этой воронки."
  phone_already_received: "Твой номер уже зарегистрирован."
  local_dashboard: "Дашборд доступен в браузере: http://localhost:8000"
  phone_button: "Отправить номер"
  dashboard_button: "Открыть дашборд"
  dashboard_prompt: "Статистика воронки:"

follow_up_messages:
  - delay_seconds: 10
    text: "Спасибо за регистрацию! Это первое запланированное сообщение."
  - delay_seconds: 60
    text: "Напоминаем о дашборде: статистика обновляется автоматически."
